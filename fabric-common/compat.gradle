/**
 * Builds a versioned Fabric compatibility overlay.
 *
 * Each layer is named after the first Minecraft version it supports. Later
 * layers only need to contain files whose Minecraft/Fabric API changed.
 * Files in later layers replace files with the same relative path from older
 * layers. A file living directly in the platform module always wins over all
 * compatibility layers.
 */
ext.cmbCompatLayers = { List<String> layers ->
    def compatOutput = layout.buildDirectory.dir('generated/cmb-compat/main/java')
    def platformJava = file('src/main/java')

    def prepareCompat = tasks.register('prepareCmbCompatSources') {
        def layerDirs = layers.collect { rootProject.file("fabric-common/src/compat/${it}/java") }

        inputs.files(layerDirs.collect { dir -> fileTree(dir) { include '**/*.java' } })
        inputs.files(fileTree(platformJava) { include '**/*.java' })
        outputs.dir compatOutput

        doLast {
            def outputDir = compatOutput.get().asFile
            delete(outputDir)
            outputDir.mkdirs()

            layers.each { layer ->
                def sourceDir = rootProject.file("fabric-common/src/compat/${layer}/java")
                if (!sourceDir.exists()) {
                    throw new GradleException("Unknown Fabric compatibility layer: ${layer}")
                }

                fileTree(sourceDir).matching { include '**/*.java' }.files.each { sourceFile ->
                    def relative = sourceDir.toPath().relativize(sourceFile.toPath())
                    def destination = outputDir.toPath().resolve(relative)
                    java.nio.file.Files.createDirectories(destination.parent)
                    java.nio.file.Files.copy(
                            sourceFile.toPath(),
                            destination,
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                }
            }

            // Truly version-specific platform code takes precedence over the
            // shared compatibility implementation with the same class/path.
            if (platformJava.exists()) {
                fileTree(platformJava).matching { include '**/*.java' }.files.each { sourceFile ->
                    def relative = platformJava.toPath().relativize(sourceFile.toPath())
                    java.nio.file.Files.deleteIfExists(outputDir.toPath().resolve(relative))
                }
            }
        }
    }

    sourceSets.main.java.srcDir(compatOutput)
    tasks.named('compileJava').configure { dependsOn prepareCompat }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn prepareCompat }
}
