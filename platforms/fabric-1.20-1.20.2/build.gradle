plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

apply from: rootProject.file('fabric-common/compat.gradle')
apply from: rootProject.file('fabric-common/compatibility-test.gradle')

base { archivesName = archives_base_name + "-[Fabric-1.20-1.20.2]" }

repositories { }

configurations {
    cmbDatagen
}

sourceSets {
    main {
        java.srcDir rootProject.file('fabric-common/src/platform/java')
        resources.srcDir rootProject.file('shared-assets/src/main/resources')
        resources.srcDir rootProject.file('fabric-common/src/platform/resources')
        resources.srcDir layout.buildDirectory.dir('generated/cmb')
    }
}

cmbCompatLayers(['v1_20'])

def cmbMinecraftVersion = cmbResolveMinecraftVersion(rootProject.mc_1_20)
def cmbFabricApiVersion = cmbResolveFabricApiVersion(rootProject.fabric_api_1_20)
def cmbDatagenProfile = cmbResolveDatagenProfile('MC_1_20')

dependencies {
    minecraft "com.mojang:minecraft:${cmbMinecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${cmbFabricApiVersion}"
    implementation project(':common')
    implementation project(':fabric-common')
    include project(':common')
    include project(':fabric-common')
    cmbDatagen project(':fabric-common')
}

def cmbGenerated = layout.buildDirectory.dir('generated/cmb')

tasks.register('runDatagen', JavaExec) {
    group = 'fabric'
    description = "Generate shared CMB resources for 1.20-1.20.2"
    dependsOn ':fabric-common:jar'
    classpath = configurations.cmbDatagen
    mainClass = 'net.cinchtail.cinchsmissingblocks.fabriccommon.datagen.FabricDataGeneratorMain'
    args cmbDatagenProfile, cmbGenerated.get().asFile.absolutePath
}

processResources {
    dependsOn tasks.named('runDatagen')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.name}" } }
}

cmbCompatibilityMatrix([
        [minecraft: rootProject.mc_1_20, fabricApi: rootProject.fabric_api_1_20, profile: 'MC_1_20'],
        [minecraft: rootProject.mc_1_20_1, fabricApi: rootProject.fabric_api_1_20_1, profile: 'MC_1_20_1'],
        [minecraft: rootProject.mc_1_20_2, fabricApi: rootProject.fabric_api_1_20_2, profile: 'MC_1_20_2'],
])
