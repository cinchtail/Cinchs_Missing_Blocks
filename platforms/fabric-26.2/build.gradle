plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

apply from: rootProject.file('fabric-common/compat.gradle')
apply from: rootProject.file('fabric-common/compatibility-test.gradle')

base { archivesName = archives_base_name + "-[Fabric-26.2]" }

repositories { }

configurations {
    cmbDatagen
}

sourceSets {
    main {
        java.srcDir rootProject.file('fabric-common/src/platform/java')
        resources.srcDir rootProject.file('shared-assets/src/main/resources')
        resources.srcDir rootProject.file('fabric-common/src/platform/resources')
        resources.srcDir layout.buildDirectory.dir('generated/cmb')
    }
}

cmbCompatLayers(['v1_20', 'v1_20_5', 'v1_21', 'v1_21_2', 'v1_21_4', 'v1_21_9', 'v26_1'])

def cmbMinecraftVersion = cmbCompatibilityMinecraft(rootProject.mc_26_2)
def cmbFabricApiVersion = cmbCompatibilityFabricApi(rootProject.fabric_api_26_2)
def cmbDatagenProfile = cmbCompatibilityProfile('MC_26_2')

dependencies {
    minecraft "com.mojang:minecraft:${cmbMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${cmbFabricApiVersion}"
    implementation project(':common')
    implementation project(':fabric-common')
    include project(':common')
    include project(':fabric-common')
    cmbDatagen project(':fabric-common')
}

def cmbGenerated = layout.buildDirectory.dir('generated/cmb')

tasks.register('runDatagen', JavaExec) {
    group = 'fabric'
    description = "Generate shared CMB resources for 26.2"
    dependsOn ':fabric-common:jar'
    classpath = configurations.cmbDatagen
    mainClass = 'net.cinchtail.cinchsmissingblocks.fabriccommon.datagen.FabricDataGeneratorMain'
    args cmbDatagenProfile, cmbGenerated.get().asFile.absolutePath
}

processResources {
    dependsOn tasks.named('runDatagen')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.name}" } }
}

cmbCompatibilityMatrix([
        [minecraft: rootProject.mc_26_2, fabricApi: rootProject.fabric_api_26_2, profile: 'MC_26_2'],
])
