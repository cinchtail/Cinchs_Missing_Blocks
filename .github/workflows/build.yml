name: Build and compatibility test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  fabric:
    name: ${{ matrix.module }} / Java ${{ matrix.java }}
    needs: validate-wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: fabric-1.20-1.20.4
            java: '17'

          - module: fabric-1.20.5-1.20.6
            java: '21'

          - module: fabric-1.21-1.21.1
            java: '21'

          - module: fabric-1.21.2-1.21.3
            java: '21'

          - module: fabric-1.21.4-1.21.8
            java: '21'

          - module: fabric-1.21.9-1.21.10
            java: '21'

          - module: fabric-1.21.11
            java: '21'

          - module: fabric-26.1-26.1.2
            java: '25'

          - module: fabric-26.2
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test Minecraft compatibility
        run: ./gradlew ":platforms:${{ matrix.module }}:testCompatibility" --stacktrace

      - name: Build JAR
        run: ./gradlew ":platforms:${{ matrix.module }}:build" --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Cinchs-Missing-Blocks-${{ matrix.module }}
          path: platforms/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.module }}
          path: |
            build/reports/**
            platforms/${{ matrix.module }}/build/reports/**
            platforms/${{ matrix.module }}/build/compatibility/**/reports/**
          if-no-files-found: ignore
          retention-days: 7
