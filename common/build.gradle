plugins {
    id 'java-library'
}

base {
    archivesName = "${rootProject.archives_base_name}-common"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
