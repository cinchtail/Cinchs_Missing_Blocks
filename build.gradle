allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}


def cmbFabricCompatibilityProjects = [
        ':platforms:fabric-1.20-1.20.2',
        ':platforms:fabric-1.20.3-1.20.4',
        ':platforms:fabric-1.20.5-1.20.6',
        ':platforms:fabric-1.21-1.21.1',
        ':platforms:fabric-1.21.2-1.21.3',
        ':platforms:fabric-1.21.4-1.21.8',
        ':platforms:fabric-1.21.9-1.21.10',
        ':platforms:fabric-1.21.11',
        ':platforms:fabric-26.1-26.1.2',
        ':platforms:fabric-26.2',
]

tasks.register('testCompatibility') {
    group = 'verification'
    description = 'Run compatibility verification for every grouped Fabric artifact'
    dependsOn cmbFabricCompatibilityProjects.collect { "${it}:testCompatibility" }
}

// The root matrix is intentionally serialized. Each group launches nested
// Gradle verification builds and running all groups in parallel would waste a
// large amount of memory while Loom is resolving several Minecraft versions.
gradle.projectsEvaluated {
    def ordered = cmbFabricCompatibilityProjects.collect { project(it).tasks.named('testCompatibility') }
    for (int i = 1; i < ordered.size(); i++) {
        def currentTask = ordered[i]
        def previousTask = ordered[i - 1]
        currentTask.configure { mustRunAfter(previousTask) }
    }
}
