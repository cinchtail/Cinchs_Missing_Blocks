license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName = "${mod_name}"
displayURL="${mod_homepage}"
issueTrackerURL="${mod_issues}"
iconFile="icon.png"
credits="${mod_credits}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"